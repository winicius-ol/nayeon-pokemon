services:
  nayeon-pokemon:
    container_name: nayeon-bot
    image: "nayeon-pokemon"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - POKEMON_CHANNEL=${POKEMON_CHANNEL}
  healthcheck:
    test: ["CMD", "python", "main.py"]
    interval: 2h
    timeout: 10s
    retries: 3
    start_period: 10s